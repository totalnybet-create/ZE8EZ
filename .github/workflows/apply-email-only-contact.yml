name: Apply email-only contact

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-email-only-contact.yml'
      - 'scripts/apply_email_only_contact.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate-contact:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply confirmed contact model
        run: python3 scripts/apply_email_only_contact.py

      - name: Run static quality checks
        run: python3 scripts/quality_check.py

      - name: Commit contact update
        run: |
          if git diff --quiet; then
            echo "Kontakt e-mail jest już skonfigurowany."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html privacy.html assets/script.js assets/site-config.json assets/visual-upgrades.css scripts/visual_check.mjs scripts/quality_check.py
          git commit -m "feat: use email-only contact"
          git push origin HEAD:main
