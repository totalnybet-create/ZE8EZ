name: Visual regression checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        run: |
          npm install --no-save --no-package-lock playwright@1.54.1
          npx playwright install --with-deps chromium

      - name: Start local server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/ze8es-http.log 2>&1 &
          echo $! > /tmp/ze8es-http.pid
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/ze8es-http.log
          exit 1

      - name: Capture and validate five viewports
        env:
          ZE8ES_BASE_URL: http://127.0.0.1:4173
          ZE8ES_SCREENSHOT_DIR: visual-artifacts
        run: node scripts/visual_check.mjs

      - name: Upload visual artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ze8es-visual-artifacts
          path: |
            visual-artifacts
            /tmp/ze8es-http.log
          if-no-files-found: warn
          retention-days: 14
