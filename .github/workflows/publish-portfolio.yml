name: Publish verified portfolio

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-portfolio.yml'
      - 'scripts/apply_portfolio_update.py'
      - 'assets/project-antiques.svg'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-portfolio:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply verified portfolio data
        run: python3 scripts/apply_portfolio_update.py

      - name: Run static quality checks
        run: python3 scripts/quality_check.py

      - name: Commit portfolio update
        run: |
          if git diff --quiet; then
            echo "Portfolio jest już aktualne."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/visual-upgrades.css README.md docs/STATUS.md
          git commit -m "feat: publish verified portfolio projects"
          git push origin HEAD:main
